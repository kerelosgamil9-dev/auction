name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate assets (icons, sounds, font)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          mkdir -p assets/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf assets/fonts/
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf assets/fonts/
          pip install pillow
          python gen_assets.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: |
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer "cython<3"

      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Show real error
        if: failure()
        shell: bash
        run: |
          echo "=== GRADLE ERROR ==="
          grep -n -B 25 -A 15 "What went wrong" build.log | tail -n 80
          echo "=== BEFORE FAILURE ==="
          grep -n -B 30 "FAILURE: Build failed with an exception" build.log | head -n 70

      - uses: actions/upload-artifact@v4
        with:
          name: grand-auction-apk
          path: bin/*.apk
